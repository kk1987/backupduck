[package]
name = "backupduck-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
folder-source = ["dep:backupduck-folder-source"]
cloud-audit = ["dep:backupduck-cloud-audit"]

[dependencies]
backupduck-folder-source = { workspace = true, optional = true }
backupduck-cloud-audit = { workspace = true, optional = true }
backupduck-core.workspace = true
backupduck-store.workspace = true
backupduck-sender.workspace = true
backupduck-transport.workspace = true
backupduck-pixel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum-server.workspace = true
rustls.workspace = true
rcgen.workspace = true
base64.workspace = true
getrandom.workspace = true
axum.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
fs2 = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
