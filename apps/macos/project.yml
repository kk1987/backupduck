name: BackupDuck
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BackupDuck:
    type: application
    platform: macOS
    sources:
      - path: BackupDuck
        excludes: [Info.plist]
      - path: ../apple/Shared
      - path: ../apple/Resources
    dependencies:
      - framework: ../../build/dependencies/sparkle/Sparkle.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck
        INFOPLIST_FILE: BackupDuck/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: '-'
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/backupduck.h
        OTHER_LDFLAGS:
          - $(inherited)
          - '$(BUILT_PRODUCTS_DIR)/libbackupduck_native.a'
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -lsqlite3
          - -lz
          - -liconv
    preBuildScripts:
      - name: Build shared Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../.."
          export MACOSX_DEPLOYMENT_TARGET=14.0
          ./scripts/fetch-sparkle.sh
          cargo build --locked --release --target aarch64-apple-darwin -p backupduck-native --features folder-source
          cp target/aarch64-apple-darwin/release/libbackupduck_native.a "$BUILT_PRODUCTS_DIR/"
schemes:
  BackupDuck:
    build:
      targets:
        BackupDuck: all
    run:
      config: Debug
